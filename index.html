<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday, Sahabat!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;font-family:'Cormorant Garamond',Georgia,serif;color:#7a1f3d;
    background:radial-gradient(circle at 50% 40%,#fff6ee 0%,#ffe3d3 55%,#f7c9b6 100%)}
  canvas{position:fixed;inset:0;width:100%;height:100%}

  /* ---------- INTRO ---------- */
  #intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:22px;z-index:10;transition:opacity 1.2s ease;text-align:center;padding:20px}
  #intro.hide{opacity:0;pointer-events:none}
  .intro-top{font-style:italic;font-size:1.1rem;letter-spacing:.08em;color:#9a4a5f}
  .heart-wrap{position:relative;width:130px;height:130px;touch-action:none;user-select:none;cursor:pointer}
  .heart-wrap::before{content:"";position:absolute;inset:-34px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,120,150,calc(.15 + var(--p,0)*.55)) 0%,transparent 70%);
    transition:background .1s}
  .heart{position:absolute;inset:0;margin:auto;width:84px;height:84px;
    animation:beat 1.6s ease-in-out infinite;transform:scale(calc(1 + var(--p,0)*.5))}
  .heart svg{width:100%;height:100%;filter:drop-shadow(0 8px 14px rgba(220,60,100,.45))}
  @keyframes beat{0%,100%{transform:scale(calc(1 + var(--p,0)*.5))}50%{transform:scale(calc(1.1 + var(--p,0)*.5))}}
  .intro-bottom{font-size:.9rem;letter-spacing:.35em;text-transform:uppercase;color:#a45a6d}

  /* ---------- TEKS HAPPY BIRTHDAY ---------- */
  #hbd{position:fixed;left:6vw;bottom:9vh;z-index:5;opacity:0;transform:translateY(14px);
    transition:all 1.6s ease;pointer-events:none}
  #hbd.show{opacity:1;transform:none}
  #hbd .small{font-style:italic;font-size:1.05rem;color:#9a4a5f}
  #hbd .big{font-family:'Great Vibes',cursive;font-size:clamp(2.6rem,9vw,4.6rem);line-height:1;color:#c2335f}
  #hbd .name{font-size:1.05rem;letter-spacing:.1em;margin-top:6px;color:#9a4a5f}

  .title-top{position:fixed;top:16px;left:0;right:0;text-align:center;z-index:5;font-weight:700;
    letter-spacing:.12em;font-size:.95rem;opacity:0;transition:opacity 1.5s}
  .title-top.show{opacity:1}

  /* ---------- KARTU UCAPAN ---------- */
  #scene2{position:fixed;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:16px;padding:18px;opacity:0;pointer-events:none;transition:opacity 1.4s ease;
    overflow-y:auto}
  #scene2.show{opacity:1;pointer-events:auto}
  .photos{display:flex;gap:10px;width:min(92vw,520px)}
  .photos .ph{flex:1;aspect-ratio:1/1.1;border-radius:14px;overflow:hidden;
    box-shadow:0 8px 20px rgba(150,40,70,.25);border:3px solid #fff;
    background:linear-gradient(135deg,#f6b8c8,#f9d7a8);display:flex;align-items:center;
    justify-content:center;font-size:2rem;transform:rotate(var(--r,0deg))}
  .photos .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .card{width:min(92vw,520px);background:rgba(255,255,255,.78);backdrop-filter:blur(8px);
    border-radius:22px;padding:26px 24px 22px;text-align:center;
    box-shadow:0 18px 50px rgba(150,40,70,.28)}
  .badge{display:inline-block;font-size:.72rem;letter-spacing:.12em;background:#fde3ea;color:#c2335f;
    padding:5px 12px;border-radius:99px;margin-bottom:12px}
  .card h1{font-size:clamp(1.5rem,5.5vw,2rem);margin-bottom:14px;color:#7a1f3d}
  .card p{font-size:1.08rem;line-height:1.6;margin-bottom:10px;color:#6b3a47}
  .sign{font-weight:700;font-size:1.3rem;color:#c2335f;margin-top:10px}
  .btn{border:0;cursor:pointer;font-family:inherit;font-weight:700;font-size:1rem;letter-spacing:.04em;
    background:#c2335f;color:#fff;padding:12px 26px;border-radius:99px;
    box-shadow:0 8px 20px rgba(194,51,95,.4);transition:transform .2s}
  .btn:hover{transform:translateY(-2px) scale(1.03)}

  /* ---------- TOMBOL SUARA ---------- */
  #mute{position:fixed;top:12px;right:12px;z-index:30;width:42px;height:42px;border-radius:50%;border:0;
    cursor:pointer;font-size:1.2rem;background:rgba(255,255,255,.75);backdrop-filter:blur(6px);
    box-shadow:0 4px 14px rgba(150,40,70,.25);display:none}

  /* ---------- MODAL HADIAH ---------- */
  #modal{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    background:rgba(90,20,40,.45);opacity:0;pointer-events:none;transition:opacity .5s;padding:20px}
  #modal.show{opacity:1;pointer-events:auto}
  .gift{background:#fff;border-radius:22px;padding:28px 24px;width:min(90vw,380px);text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.35);transform:scale(.85);transition:transform .5s cubic-bezier(.2,1.4,.4,1)}
  #modal.show .gift{transform:scale(1)}
  .gift .emoji{font-size:3.2rem;margin-bottom:6px}
  .gift h2{font-size:1.5rem;margin-bottom:8px}
  .gift p{font-size:1.05rem;color:#6b3a47;line-height:1.55;margin-bottom:16px}
  .gift .reveal{background:#fff0f4;border:1px dashed #e58aa5;border-radius:12px;padding:12px;margin-bottom:16px;
    font-weight:600;color:#c2335f;display:none}
  .gift .close{display:block;margin:12px auto 0;background:none;border:0;font-family:inherit;
    color:#a45a6d;cursor:pointer;text-decoration:underline}
</style>
</head>
<body>

<canvas id="c"></canvas>

<!-- MUSIK LATAR: taruh file musik.mp3 di folder yang sama -->
<audio id="bgm" src="projek3.mp3" loop preload="auto"></audio>
<button id="mute" aria-label="Nyalakan atau matikan suara">&#128266;</button>

<!-- INTRO -->
<div id="intro">
  <div class="intro-top">sedikit kejutan, untukmu</div>
  <div class="heart-wrap" id="heartWrap">
    <div class="heart"><svg viewBox="0 0 32 29"><defs>
      <radialGradient id="g" cx="35%" cy="30%"><stop offset="0" stop-color="#ffb3c6"/><stop offset="1" stop-color="#e0305f"/></radialGradient></defs>
      <path fill="url(#g)" d="M23.6 0c-3.4 0-6.3 2.7-7.6 5.6C14.7 2.7 11.8 0 8.4 0 3.8 0 0 3.8 0 8.4c0 9.4 9.5 11.9 16 21.2 6.1-9.3 16-12.1 16-21.2C32 3.8 28.2 0 23.6 0z"/></svg></div>
  </div>
  <div class="intro-bottom">tahan &amp; lepaskan</div>
</div>

<div class="title-top" id="titleTop">Doa &amp; Cerita Kita</div>

<div id="hbd">
  <div class="small">dan hari ini adalah hari...</div>
  <div class="big">Happy Birthday</div>
  <div class="name" id="hbdName"></div>
</div>

<!-- KARTU UCAPAN -->
<div id="scene2">
  <div class="photos" id="photos"></div>
  <div class="card">
    <span class="badge">&#10084; pesan untukmu</span>
    <h1 id="cardTitle"></h1>
    <div id="cardText"></div>
    <div class="sign" id="cardSign"></div>
  </div>
  <button class="btn" id="giftBtn">&#127873; Kirim Hadiah</button>
</div>

<!-- MODAL HADIAH -->
<div id="modal">
  <div class="gift">
    <div class="emoji">&#127873;</div>
    <h2>Hadiah Spesial Untukmu!</h2>
    <p id="giftIntro"></p>
    <div class="reveal" id="giftReveal"></div>
    <button class="btn" id="openGift">Buka Hadiah</button>
    <button class="close" id="closeGift">tutup</button>
  </div>
</div>

<script>
/* =====================================================
   EDIT BAGIAN INI SAJA (nama, pesan, foto, hadiah)
   ===================================================== */
const CONFIG = {
  namaSahabat : "Sahabatku",           // nama sahabatmu, contoh: "Dinda"
  namaKamu    : "RIZKIYA KEISHA CHANDRA",             // namamu, untuk tanda tangan
  judulKartu  : "Selamat Ulang Tahun, Sahabatku!",
  pesan : [
    "Dari seragam TK sampai sekarang, kamu masih jadi orang yang selalu ada di sampingku.",
    "Terima kasih sudah menemani tawa, tangis, dan semua cerita konyol kita.",
    "Semoga di umur yang baru ini kamu selalu sehat, bahagia, dan semua mimpimu pelan-pelan jadi nyata.",
    "Aku bersyukur banget bisa kenal kamu sejak kecil."
  ],
  // letakkan foto di folder yang sama, ganti nama file sesuai fotomu (boleh kosongkan array)
  foto : ["poto1.jpeg", "poto2.jpeg", "poto3.jpeg", "poto4.jpeg"],
  musik       : "projek3.mp3",           // nama file lagu (taruh di folder yang sama)
  volume      : 0.6,                   // 0 sampai 1
  teksHadiah  : "Aku punya hadiah kecil buatmu. Klik tombol di bawah untuk membukanya.",
  isiHadiah   : "Voucher traktir makan bareng + pelukan gratis seumur hidup \u2764"
};
/* ===================================================== */

const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
let W, H, DPR = Math.min(window.devicePixelRatio || 1, 2);
function resize(){
  W = innerWidth; H = innerHeight;
  cv.width = W*DPR; cv.height = H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  if (started) buildTree();
}
addEventListener('resize', resize);

// isi teks dari CONFIG
$('hbdName').textContent = '~ untuk ' + CONFIG.namaSahabat + ' ~';
$('cardTitle').textContent = CONFIG.judulKartu;
$('cardText').innerHTML = CONFIG.pesan.map(t => `<p>${t}</p>`).join('');
$('cardSign').textContent = '- ' + CONFIG.namaKamu + ' -';
$('giftIntro').textContent = CONFIG.teksHadiah;
$('giftReveal').textContent = CONFIG.isiHadiah;
const rots = ['-3deg','0deg','3deg'];
$('photos').innerHTML = CONFIG.foto.slice(0,3).map((f,i) =>
  `<div class="ph" style="--r:${rots[i]}"><img src="${f}" alt="foto ${i+1}" onerror="this.replaceWith(document.createTextNode('\u{1F4F7}'))"></div>`).join('');

/* ---------------- INTRO: tahan lalu lepas ---------------- */
const wrap = $('heartWrap');
let charge = 0, holding = false, started = false, lastT = 0;
wrap.addEventListener('pointerdown', e => { holding = true; wrap.setPointerCapture(e.pointerId); });
function release(){
  if (!holding) return; holding = false;
  if (charge >= 0.85) startShow(); else charge = 0;
  wrap.style.setProperty('--p', charge);
}
wrap.addEventListener('pointerup', release);
wrap.addEventListener('pointercancel', () => { holding=false; charge=0; wrap.style.setProperty('--p',0); });
(function chargeLoop(t){
  if (!started){
    const dt = Math.min((t-lastT)/1000, .05); lastT = t;
    if (holding) charge = Math.min(1, charge + dt/1.1);
    else if (charge > 0) charge = Math.max(0, charge - dt*1.5);
    wrap.style.setProperty('--p', charge.toFixed(3));
    requestAnimationFrame(chargeLoop);
  }
})(0);

/* ---------------- POHON & HATI ---------------- */
let segs = [], hearts = [], petals = [], t0 = 0;
const GROW = 5200;      // ms pohon tumbuh
const BLOOM = 4800;     // ms hati mekar

function buildTree(){
  segs = []; hearts = [];
  const bx = W/2, by = H*0.93;
  const trunk = Math.min(H*0.26, 230);
  const R = Math.min(W*0.46, H*0.30);
  (function branch(x,y,ang,len,w,d,start){
    const x2 = x + Math.cos(ang)*len, y2 = y + Math.sin(ang)*len;
    const dur = GROW*0.17;
    segs.push({x,y,x2,y2,w,start,dur});
    if (d >= 6) return;
    const n = d < 2 ? 2 : (Math.random()<.35 ? 3 : 2);
    for (let i=0;i<n;i++){
      const spread = (i/(n-1||1) - .5) * (0.9 + Math.random()*.3);
      branch(x2,y2, ang+spread+(Math.random()-.5)*.2, len*(.72+Math.random()*.08), w*.68, d+1, start+dur*0.85);
    }
  })(bx,by,-Math.PI/2,trunk,Math.max(10, W*0.022),0,0);

  // hati-hati balon membentuk bentuk hati
  const cx = bx, cy = by - trunk*1.7 - R*0.1;
  const cols = ['#f7a8c4','#f48fb1','#ec6b95','#f9c27a','#f4a259','#ffd9a0','#f06292'];
  let tries = 0;
  while (hearts.length < 300 && tries++ < 20000){
    const x = (Math.random()*2-1)*1.4, y = (Math.random()*2-1)*1.4;
    const v = Math.pow(x*x+y*y-1,3) - x*x*y*y*y;
    if (v < 0){
      hearts.push({
        x: cx + x*R*0.78, y: cy - y*R*0.78,
        s: 9 + Math.random()*16, c: cols[(Math.random()*cols.length)|0],
        d: Math.random()*0.75, rot: (Math.random()-.5)*.8
      });
    }
  }
  hearts.sort((a,b) => a.y - b.y);
}

function heartPath(x,y,s,rot){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot); ctx.scale(s/16, s/16);
  ctx.beginPath();
  ctx.moveTo(0,6);
  ctx.bezierCurveTo(-14,-4,-8,-16,0,-8);
  ctx.bezierCurveTo(8,-16,14,-4,0,6);
  ctx.closePath(); ctx.restore();
}

function drawScene(now){
  ctx.clearRect(0,0,W,H);
  const e = now - t0;

  // batang & cabang
  ctx.lineCap = 'round';
  for (const s of segs){
    const p = Math.min(1, Math.max(0, (e - s.start)/s.dur));
    if (p <= 0) continue;
    const ex = s.x + (s.x2-s.x)*p, ey = s.y + (s.y2-s.y)*p;
    ctx.strokeStyle = '#8a3a4d'; ctx.lineWidth = s.w;
    ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(ex,ey); ctx.stroke();
  }

  // hati mekar
  const be = e - GROW*0.78;
  if (be > 0){
    for (const h of hearts){
      const p = Math.min(1, Math.max(0, (be/BLOOM - h.d)/0.25));
      if (p <= 0) continue;
      const ease = 1 - Math.pow(1-p, 3);
      const sway = Math.sin(now/900 + h.x*0.02) * 1.6 * p;
      heartPath(h.x+sway, h.y, h.s*ease, h.rot);
      ctx.fillStyle = h.c; ctx.globalAlpha = .93; ctx.fill();
      ctx.globalAlpha = .5; ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(h.x+sway-h.s*.12, h.y-h.s*.12, h.s*.1*ease, 0, 7); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  // kelopak berjatuhan
  if (e > GROW + 1500){
    if (Math.random() < .35 && petals.length < 70){
      petals.push({x:Math.random()*W, y:-12, s:6+Math.random()*9, vy:.5+Math.random()*1.2,
        vx:(Math.random()-.5)*.6, r:Math.random()*6, c:['#f48fb1','#f9c27a','#ec6b95'][(Math.random()*3)|0]});
    }
    for (let i=petals.length-1;i>=0;i--){
      const p = petals[i]; p.y += p.vy; p.x += p.vx + Math.sin(p.y/40)*.4; p.r += .03;
      heartPath(p.x,p.y,p.s,Math.sin(p.r)*.6);
      ctx.fillStyle = p.c; ctx.globalAlpha = .85; ctx.fill(); ctx.globalAlpha = 1;
      if (p.y > H+20) petals.splice(i,1);
    }
  }
  requestAnimationFrame(drawScene);
}

/* ---------------- SUARA ---------------- */
const bgm = $('bgm'), muteBtn = $('mute');
bgm.src = CONFIG.musik; bgm.volume = CONFIG.volume;
let muted = false, ac = null;
function chime(freqs, gap){
  if (muted) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f,i) => {
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + i*gap;
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.25, t+0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t+0.9);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+1);
    });
  } catch(e){}
}
function playMusic(){
  muteBtn.style.display = 'block';
  bgm.play().catch(() => {});   // kalau file musik tidak ada, tetap jalan tanpa error
}
muteBtn.onclick = () => {
  muted = !muted; bgm.muted = muted;
  muteBtn.textContent = muted ? '\u{1F507}' : '\u{1F50A}';
};

let timers = [];
function startShow(){
  started = true;
  playMusic();
  chime([523,659,784,1047], 0.14);
  $('intro').classList.add('hide');
  resize(); buildTree();
  t0 = performance.now();
  requestAnimationFrame(drawScene);
  timers.push(setTimeout(() => { $('hbd').classList.add('show'); $('titleTop').classList.add('show'); }, GROW*0.9));
  timers.push(setTimeout(() => { $('hbd').classList.remove('show'); $('scene2').classList.add('show'); }, GROW + BLOOM + 1800));
}
resize();

/* ---------------- HADIAH ---------------- */
$('giftBtn').onclick = () => { $('modal').classList.add('show'); chime([392,523], 0.12); };
$('closeGift').onclick = () => $('modal').classList.remove('show');
$('openGift').onclick = () => {
  $('giftReveal').style.display = 'block';
  $('openGift').style.display = 'none';
  chime([523,659,784,1047,1319], 0.11);
  for (let i=0;i<90;i++) petals.push({x:W/2+(Math.random()-.5)*80, y:H/2, s:7+Math.random()*10,
    vy:-3+Math.random()*7, vx:(Math.random()-.5)*7, r:Math.random()*6,
    c:['#f48fb1','#f9c27a','#ec6b95','#ffd9a0'][(Math.random()*4)|0]});
};
</script>
</body>
</html>
